<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02040a">
  <meta name="description" content="Orbitalis Pelagia：原始 15360×7680 纹理的彩色风暴星球与底部朝向地心、公转且圆环独立自转的精细空间站。拖动星球旋转，持续拖动空间站可前后环绕，调整轨道倾角。">
  <title>Orbitalis · Pelagia</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <link rel="preload" as="image" href="./media/cinematic/planet_fallback.webp">
</head>
<body>
  <main class="observatory" aria-label="Pelagia 交互星球预览">
    <button id="lunar-surface" class="surface" type="button" aria-label="探索场景：拖星球旋转，持续拖空间站前后环绕，调整位置与轨道倾角；滚轮或双指缩放，Shift 拖动平移，方向键调整星球，加减键缩放，Home 复位" aria-describedby="instructions" data-phase="poster">
      <img id="lunar-poster" class="media poster" src="./media/cinematic/planet_fallback.webp" width="1600" height="1200" alt="圆润的蓝绿、紫色与暖金色风暴星球，旁侧是银灰与暖金色的精细环形空间站，背景为低调的深空与稀疏星光" decoding="async" draggable="false">
      <span id="lunar-canvas" class="media canvas"></span>
    </button>
    <header class="masthead">
      <a class="brand" href="./" aria-label="Orbitalis Pelagia 首页"><span class="brand-symbol" aria-hidden="true"></span>ORBITALIS<span class="brand-divider">/</span><span class="brand-sub">PELAGIA</span></a>
      <span id="scene-mode" class="scene-mode">ORBITAL STUDY</span>
    </header>
    <div class="interaction">
      <p id="scene-status" class="scene-status" role="status" aria-live="polite">点击星球，开启交互</p>
      <p id="scene-resolution" class="scene-resolution" role="status" aria-live="polite">静态预览 · 交互后载入 4K 三维</p>
      <div class="control-row">
      <div class="controls" aria-label="星球控制">
        <button id="rotation-toggle" class="control" type="button" aria-label="开启自动旋转" aria-pressed="false"><span id="rotation-icon" class="control-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor"><path d="m5 3 8 5-8 5z"/></svg></span><span id="rotation-label">自动旋转</span></button>
        <span class="control-divider" aria-hidden="true"></span>
        <button id="reset-view" class="control" type="button" aria-label="复位星球视角与缩放并停止自动旋转"><svg class="control-icon" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4.6 7.6a6 6 0 1 1-.3 4.2M4.6 3.3v4.6h4.6" stroke-linecap="round" stroke-linejoin="round"/></svg>复位视角</button>
      </div>
      <div class="controls zoom-controls" role="group" aria-label="缩放视角">
        <button id="zoom-out" class="control zoom-button" type="button" aria-label="缩小视角" aria-controls="lunar-surface" disabled>−</button>
        <output id="zoom-level" class="zoom-level" aria-label="当前放大倍数">1×</output>
        <button id="zoom-in" class="control zoom-button" type="button" aria-label="放大视角" aria-controls="lunar-surface">+</button>
      </div>
      </div>
      <p id="instructions" class="instructions">拖星球旋转 / 持续拖空间站环绕<span>·</span>滚轮 / 双指缩放<span>·</span>Shift 拖动平移</p>
      <noscript><p class="noscript-note">当前为静态预览。启用 JavaScript 后可探索三维场景。</p></noscript>
    </div>
    <span class="edition" aria-hidden="true">CINEMATIC ORBITAL STUDY</span>
  </main>
  <script type="module" src="./assets/main.js"></script>
</body>
</html>
